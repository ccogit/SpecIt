name: SpecIt Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check server.mjs
          node --check studio.mjs
          node --check interview.mjs
          node --check planner.mjs
      - name: Unit and integration tests
        env:
          SPECIT_NO_CLAUDE_CODE: '1'
          SPECIT_NO_CODEX: '1'
        run: npm test
